
name: Build REDLINE V4

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Find and build project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Recurse -Filter *.csproj |
            Select-Object -First 1

          if (-not $project) {
            throw "No C# project file found."
          }

          dotnet publish $project.FullName `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Upload REDLINE artifact
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-V4-Windows
          path: publish/
          if-no-files-found: error
