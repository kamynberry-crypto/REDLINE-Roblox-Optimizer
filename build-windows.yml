name: Build REDLINE Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows executable
        run: dotnet publish RedlineRobloxOptimizer.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
      - name: Upload REDLINE
        uses: actions/upload-artifact@v4
        with:
          name: REDLINE-v3-Windows
          path: bin/Release/net8.0-windows/win-x64/publish/REDLINE.exe
